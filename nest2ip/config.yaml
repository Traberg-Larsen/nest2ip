name: nest2ip
version: "0.1.0"
slug: nest2ip
description: Google Nest-kameraer som almindelige RTSP-streams, lokalt og kvotesikkert
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
ingress: true
ingress_port: 8787
panel_icon: mdi:cctv
panel_title: nest2ip
watchdog: "http://[HOST]:[PORT:8787]/health"
map:
  - homeassistant_config:ro
options:
  project_id: ""
  use_home_assistant_login: true
  client_id: ""
  client_secret: ""
  refresh_token: ""
  http_port: 8787
  idle_timeout_minutes: 10
  snapshot_key_required: true
  cameras: []
schema:
  project_id: str?
  use_home_assistant_login: bool
  client_id: str?
  client_secret: password?
  refresh_token: password?
  http_port: port
  idle_timeout_minutes: int(1,1440)
  snapshot_key_required: bool
  project_calls_per_minute: int(1,10)?
  camera_calls_per_minute: int(1,5)?
  camera_calls_per_hour: int(1,100)?
  cameras:
    - name: str
      device_id: str?
      port: port
      path: str
      muted_path: str?
      always_on: bool?
